# Gözlemlenebilirlik yığını (SPEC §14):
# Prometheus + Alertmanager + Loki + Alloy + Grafana.
#
# Dokploy'da AYRI bir Compose servisi olarak, docker-compose.prod.yml'in yanında
# çalışır. Her iki yığın da "vibe-shop" adlı Docker ağına bağlanır
# (docker-compose.prod.yml içinde `networks.default.name: vibe-shop` ile
# adlandırılır), böylece Prometheus doğrudan api:8080'e, Alloy da Docker
# soketinden tüm container'lara erişebilir.
#
# Dokploy Environment ekranından gelmesi gereken değişkenler:
#   GRAFANA_PASSWORD  - Grafana admin parolası (düz metin secret yok)
#
# Slack webhook'u observability/alertmanager.yml içinde ayarlanır.
# Traefik/Dokploy alan adı yönlendirmesi Grafana'nın 3000 portuna yapılmalı.
services:
  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # retention prometheus.yml'de değil yalnızca CLI bayrağıyla ayarlanır.
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus-rules.yml:/etc/prometheus/rules/vibe-shop.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - alertmanager
    expose:
      - "9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
      # Slack webhook URL'i (tek satır). Dosyayı oluşturduktan sonra bu satırı açın:
      # - ./observability/secrets/slack_api_url:/etc/alertmanager/secrets/slack_api_url:ro
    expose:
      - "9093"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      # Ruler local storage: kurallar <dir>/<tenant>/ altında; auth kapalı → "fake".
      - ./observability/loki-rules.yml:/etc/loki/rules/fake/vibe-shop.yml:ro
      - loki-data:/loki
    depends_on:
      - alertmanager
    expose:
      - "3100"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.5.1
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      # Container keşfi + log okuma için salt-okunur Docker soketi.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    expose:
      - "12345"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      # Kayıt olma kapalı.
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    expose:
      - "3000"
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  alloy-data:
  grafana-data:

# vibe-shop yığınının oluşturduğu ağa dışarıdan bağlan; tüm servisler
# (Grafana <-> Prometheus/Loki dahil) burada birbirini servis adıyla görür.
networks:
  default:
    name: vibe-shop
    external: true
