# Alertmanager yapılandırması.
#
# Slack webhook'u repoda TUTULMAZ (GitHub push protection engelliyor). Bunun
# yerine her slack_config `api_url_file` ile bir dosyadan okur:
#   /etc/alertmanager/secrets/slack_api_url
#
# Bu dosyayı yerleştirmenin yolları:
#   - Dokploy: servise bir "mount" ekleyip içeriği webhook URL'i olan tek satır
#     bir dosyayı bu yola bağlayın; ya da
#   - repoda observability/secrets/slack_api_url oluşturun (bkz. .gitignore) ve
#     docker-compose.observability.yml'deki yorumlu mount satırını açın.
#
# Dosya yoksa Alertmanager yine sorunsuz başlar; yalnızca bildirim gönderemez
# ve PrometheusAlertmanagerNotificationsFailing uyarısı tetiklenir.
# E-posta alternatifi için en alttaki yorumlu örneğe bakın.
global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: slack-default
  routes:
    - matchers:
        - severity = "critical"
      receiver: slack-critical
      repeat_interval: 1h

inhibit_rules:
  # Aynı alarm hem critical hem warning ise, warning'i sustur.
  - source_matchers: [severity = "critical"]
    target_matchers: [severity = "warning"]
    equal: ["alertname", "job"]
  # Hedef tamamen down ise, o instance'a bağlı warning'leri sustur.
  - source_matchers: [alertname = "TargetDown"]
    target_matchers: [severity = "warning"]
    equal: ["instance"]

receivers:
  - name: slack-default
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_api_url
        channel: "#vibe-shop-alerts"
        send_resolved: true
        title: '{{ if eq .Status "firing" }}:red_circle:{{ else }}:large_green_circle:{{ end }} {{ .CommonLabels.alertname }} ({{ .Status }})'
        text: >-
          {{ range .Alerts }}*{{ .Labels.severity | toUpper }}* — {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

  - name: slack-critical
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_api_url
        channel: "#vibe-shop-alerts-critical"
        send_resolved: true
        title: '{{ if eq .Status "firing" }}:rotating_light:{{ else }}:large_green_circle:{{ end }} [CRITICAL] {{ .CommonLabels.alertname }} ({{ .Status }})'
        text: >-
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

