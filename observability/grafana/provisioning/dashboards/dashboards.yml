# Dashboard sağlayıcısı: /var/lib/grafana/dashboards altındaki JSON'ları yükler.
apiVersion: 1

providers:
  - name: vibe-shop
    orgId: 1
    folder: vibe-shop
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
