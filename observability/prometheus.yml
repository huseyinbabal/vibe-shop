# Prometheus yapılandırması.
# retention (15 gün) burada değil, compose'daki
# --storage.tsdb.retention.time=15d bayrağıyla ayarlanır.
global:
  scrape_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # vibe-shop API — aynı Docker ağında olduğu için servis adıyla erişilir.
  - job_name: vibe-shop-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]

  # Prometheus'un kendi metrikleri.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Alertmanager metrikleri.
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # Loki metrikleri.
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
